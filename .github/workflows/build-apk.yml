name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java could not be detected on PATH."
            exit 1
          fi

          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Unable to detect Java version from 'java -version' output."
            exit 1
          fi

          JAVA_MAJOR="${JAVA_VERSION_STR%%.*}"
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(printf '%s' "$JAVA_VERSION_STR" | cut -d'.' -f2)
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '${JAVA_VERSION_STR}'."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version ${JAVA_VERSION_STR} is lower than required version 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            if [ ! -x "${JAVA_HOME}/bin/keytool" ]; then
              echo "::error::keytool not found in configured Java installation (${JAVA_HOME}/bin/keytool)."
              exit 1
            fi

            "${JAVA_HOME}/bin/keytool" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is empty (0 bytes)."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${APK_PATH}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Missing or empty source APK at ${SOURCE_APK}."
            exit 1
          fi

          STAGING_DIR=$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")
          ASSET_FILE="${STAGING_DIR}/app-debug.apk"

          cp -f "$SOURCE_APK" "$ASSET_FILE"

          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Failed to copy release asset to ${ASSET_FILE}."
            exit 1
          fi

          echo "asset_path=${ASSET_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi

          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK does not exist at '${ASSET_PATH:-}'."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK at '${ASSET_PATH}' is empty."
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset '${ASSET_PATH}' does not end in .apk."
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got '${ASSET_FILENAME}'."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated debug APK build (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT})."
